name: Apply AI V2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AI V2
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ai = Path('backend/services/aiSearch.js')
          text = ai.read_text()
          if 'aiDiscoveryV2.js' not in text:
              marker = 'import {\n  getSemanticScoreMap\n} from "./semanticSearch.js";'
              text = text.replace(marker, marker + '\n\nimport { discover } from "./aiDiscoveryV2.js";')
          pattern = r'async function hybridRetrieve\([\s\S]*?\n}\n\nasync function searchProducts'
          replacement = '''async function hybridRetrieve(\n  products,\n  query,\n  options = {}\n) {\n  const response = await discover(products, query, options);\n  return response.results;\n}\n\nasync function searchProducts'''
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('hybridRetrieve replacement failed')
          ai.write_text(updated)

          server = Path('backend/server.js')
          text = server.read_text()
          route_start = text.find('app.post(\n  "/api/ai-search"')
          route_end = text.find('app.post(\n  "/api/discovery"', route_start)
          if route_start < 0 or route_end < 0:
              raise SystemExit('AI search route not found')
          section = text[route_start:route_end]
          old = '''      return res.json({\n        success:\n          true,\n        query,\n        filters,\n        results,\n        count:\n          results.length,\n        model:\n          MODEL_NAME,\n        retrieval:\n          "hybrid",\n        gateway:\n          "node",\n        ai_backend:\n          "transformers.js"\n      });'''
          new = '''      return res.json({\n        success:\n          true,\n        query,\n        filters,\n        results,\n        count:\n          results.length,\n        model:\n          MODEL_NAME,\n        retrieval:\n          "hybrid-v2",\n        gateway:\n          "node",\n        ai_backend:\n          "transformers.js",\n        intent:\n          results[0]?.aiIntent || null,\n        outfitPlan:\n          results[0]?.outfitPlan || null,\n        stylePlan:\n          results[0]?.stylePlan || null\n      });'''
          if old not in section:
              raise SystemExit('AI search response block not found')
          section = section.replace(old, new, 1)
          server.write_text(text[:route_start] + section + text[route_end:])

          html = Path('index.html')
          text = html.read_text()
          marker = '<script src="./app.js"></script>'
          replacement = marker + '\n  <script src="./ai-experience.js"></script>'
          if 'ai-experience.js' not in text:
              if marker not in text:
                  raise SystemExit('app.js script tag not found')
              text = text.replace(marker, replacement, 1)
              html.write_text(text)

          css = Path('style.css')
          text = css.read_text()
          marker = '.ai-v2-panel'
          if marker not in text:
              text += '''\n\n.ai-v2-panel {\n  margin: 0 0 24px;\n  padding: 24px;\n  border: 1px solid rgba(25, 25, 25, .12);\n  border-radius: 24px;\n  background: linear-gradient(135deg, rgba(255,255,255,.98), rgba(246,244,239,.92));\n  box-shadow: 0 18px 45px rgba(0,0,0,.06);\n}\n\n.ai-v2-panel-head, .ai-v2-outfit-head {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: 18px;\n}\n\n.ai-v2-panel h3, .ai-v2-outfit h4, .ai-v2-style-plan h4 {\n  margin: 6px 0 0;\n}\n\n.ai-v2-model {\n  font-size: 12px;\n  padding: 8px 12px;\n  border-radius: 999px;\n  background: rgba(25,25,25,.06);\n  white-space: nowrap;\n}\n\n.ai-v2-query {\n  margin-top: 20px;\n  font-size: 18px;\n  line-height: 1.5;\n}\n\n.ai-v2-chips, .ai-v2-tags, .ai-v2-reasons {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n}\n\n.ai-v2-chips {\n  margin-top: 14px;\n}\n\n.ai-v2-chips span, .ai-v2-tags span {\n  padding: 7px 11px;\n  border-radius: 999px;\n  background: rgba(25,25,25,.07);\n  font-size: 12px;\n}\n\n.ai-v2-outfit, .ai-v2-style-plan {\n  margin-top: 20px;\n  padding: 18px;\n  border-radius: 18px;\n  background: rgba(255,255,255,.82);\n  border: 1px solid rgba(25,25,25,.09);\n}\n\n.ai-v2-outfit-items {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));\n  gap: 10px;\n  margin-top: 16px;\n}\n\n.ai-v2-outfit-items div {\n  display: grid;\n  gap: 4px;\n  padding: 12px;\n  border-radius: 14px;\n  background: rgba(25,25,25,.045);\n}\n\n.ai-v2-outfit-items span, .ai-v2-outfit-items small, .ai-v2-meta {\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: .08em;\n  opacity: .62;\n}\n\n.ai-v2-reasons {\n  margin-top: 14px;\n}\n\n.ai-v2-reasons span {\n  font-size: 12px;\n  opacity: .78;\n}\n\n.ai-v2-results-grid {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 18px;\n}\n\n.ai-v2-product-card {\n  overflow: hidden;\n  border: 1px solid rgba(25,25,25,.1);\n  border-radius: 20px;\n  background: #fff;\n  box-shadow: 0 12px 32px rgba(0,0,0,.045);\n}\n\n.ai-v2-product-media {\n  position: relative;\n  aspect-ratio: 1 / 1.08;\n  overflow: hidden;\n  background: #eeece7;\n}\n\n.ai-v2-product-media img {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.ai-v2-product-placeholder {\n  display: grid;\n  place-items: center;\n  align-content: center;\n  gap: 8px;\n  height: 100%;\n  padding: 24px;\n  text-align: center;\n}\n\n.ai-v2-product-placeholder span {\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: .12em;\n  opacity: .55;\n}\n\n.ai-v2-product-placeholder strong {\n  font-family: "Playfair Display", serif;\n  font-size: 32px;\n}\n\n.ai-v2-score {\n  position: absolute;\n  top: 12px;\n  left: 12px;\n  padding: 8px 10px;\n  border-radius: 999px;\n  background: rgba(20,20,20,.9);\n  color: #fff;\n  font-size: 11px;\n  font-weight: 700;\n}\n\n.ai-v2-product-body {\n  padding: 18px;\n}\n\n.ai-v2-product-body h3 {\n  margin: 7px 0 12px;\n  font-family: "Playfair Display", serif;\n  font-size: 23px;\n}\n\n.ai-v2-tags {\n  margin-bottom: 14px;\n}\n\n.ai-v2-footer {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  margin-top: 16px;\n}\n\n.ai-v2-footer strong {\n  font-size: 16px;\n}\n\n.ai-v2-footer button {\n  border: 0;\n  background: transparent;\n  font: inherit;\n  cursor: pointer;\n}\n\n.ai-v2-loading {\n  animation: aiPulse 1.3s ease-in-out infinite alternate;\n}\n\n@keyframes aiPulse {\n  from { opacity: .58; }\n  to { opacity: 1; }\n}\n\n@media (max-width: 900px) {\n  .ai-v2-results-grid {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }\n}\n\n@media (max-width: 620px) {\n  .ai-v2-panel-head, .ai-v2-outfit-head {\n    flex-direction: column;\n  }\n  .ai-v2-results-grid {\n    grid-template-columns: 1fr;\n  }\n}\n'''
              css.write_text(text)

          sem = Path('backend/services/semanticSearch.js')
          text = sem.read_text()
          pattern = r'async function embedProducts\([\s\S]*?\n}\n\nasync function semanticSearch'
          replacement = '''async function embedProducts(\n  products\n) {\n  if (!Array.isArray(products) || !products.length) {\n    return [];\n  }\n\n  const results = new Array(products.length);\n  const missing = [];\n\n  products.forEach((product, index) => {\n    const id = String(product?.id ?? "");\n    const text = productToText(product);\n    const cacheKey = `${id}::${text}`;\n    const embedding = productCache.get(cacheKey);\n    if (embedding) {\n      results[index] = { product, embedding };\n    } else {\n      missing.push({ product, index, cacheKey, text });\n    }\n  });\n\n  if (missing.length) {\n    const model = await getExtractor();\n    const outputs = await model(missing.map(item => item.text), { pooling: "mean", normalize: true });\n    const values = typeof outputs?.tolist === "function" ? outputs.tolist() : outputs;\n\n    missing.forEach((item, index) => {\n      const raw = Array.isArray(values?.[index]) ? values[index] : [];\n      const embedding = normalizeVector(raw);\n      cacheSet(item.cacheKey, embedding);\n      results[item.index] = { product: item.product, embedding };\n    });\n  }\n\n  return results.filter(Boolean);\n}\n\nasync function semanticSearch'''
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('semantic batch replacement failed')
          sem.write_text(updated)
          PY

          git rm -f .github/workflows/apply-ai-v2.yml
          git add backend/services/aiSearch.js backend/services/aiDiscoveryV2.js backend/services/aiIntent.js backend/services/aiOutfit.js backend/services/semanticSearch.js backend/server.js index.html ai-experience.js style.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Upgrade AI-first fashion discovery experience"
          git push
