name: Add AI V2 CSS

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add AI V2 CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('style.css')
          text = css.read_text()
          if '.ai-v2-panel' not in text:
              text += '''\n\n.ai-v2-panel { margin: 0 0 24px; padding: 24px; border: 1px solid rgba(25,25,25,.12); border-radius: 24px; background: linear-gradient(135deg,rgba(255,255,255,.98),rgba(246,244,239,.92)); box-shadow: 0 18px 45px rgba(0,0,0,.06); }\n.ai-v2-panel-head,.ai-v2-outfit-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; }\n.ai-v2-panel h3,.ai-v2-outfit h4,.ai-v2-style-plan h4 { margin:6px 0 0; }\n.ai-v2-model { font-size:12px; padding:8px 12px; border-radius:999px; background:rgba(25,25,25,.06); white-space:nowrap; }\n.ai-v2-query { margin-top:20px; font-size:18px; line-height:1.5; }\n.ai-v2-chips,.ai-v2-tags,.ai-v2-reasons { display:flex; flex-wrap:wrap; gap:8px; }\n.ai-v2-chips { margin-top:14px; }\n.ai-v2-chips span,.ai-v2-tags span { padding:7px 11px; border-radius:999px; background:rgba(25,25,25,.07); font-size:12px; }\n.ai-v2-outfit,.ai-v2-style-plan { margin-top:20px; padding:18px; border-radius:18px; background:rgba(255,255,255,.82); border:1px solid rgba(25,25,25,.09); }\n.ai-v2-outfit-items { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:16px; }\n.ai-v2-outfit-items div { display:grid; gap:4px; padding:12px; border-radius:14px; background:rgba(25,25,25,.045); }\n.ai-v2-outfit-items span,.ai-v2-outfit-items small,.ai-v2-meta { font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.62; }\n.ai-v2-reasons { margin-top:14px; }\n.ai-v2-reasons span { font-size:12px; opacity:.78; }\n.ai-v2-results-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }\n.ai-v2-product-card { overflow:hidden; border:1px solid rgba(25,25,25,.1); border-radius:20px; background:#fff; box-shadow:0 12px 32px rgba(0,0,0,.045); }\n.ai-v2-product-media { position:relative; aspect-ratio:1/1.08; overflow:hidden; background:#eeece7; }\n.ai-v2-product-media img { width:100%; height:100%; object-fit:cover; }\n.ai-v2-product-placeholder { display:grid; place-items:center; align-content:center; gap:8px; height:100%; padding:24px; text-align:center; }\n.ai-v2-product-placeholder span { font-size:11px; text-transform:uppercase; letter-spacing:.12em; opacity:.55; }\n.ai-v2-product-placeholder strong { font-family:"Playfair Display",serif; font-size:32px; }\n.ai-v2-score { position:absolute; top:12px; left:12px; padding:8px 10px; border-radius:999px; background:rgba(20,20,20,.9); color:#fff; font-size:11px; font-weight:700; }\n.ai-v2-product-body { padding:18px; }\n.ai-v2-product-body h3 { margin:7px 0 12px; font-family:"Playfair Display",serif; font-size:23px; }\n.ai-v2-tags { margin-bottom:14px; }\n.ai-v2-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; }\n.ai-v2-footer strong { font-size:16px; }\n.ai-v2-footer button { border:0; background:transparent; font:inherit; cursor:pointer; }\n.ai-v2-loading { animation:aiPulse 1.3s ease-in-out infinite alternate; }\n@keyframes aiPulse { from { opacity:.58; } to { opacity:1; } }\n@media (max-width:900px) { .ai-v2-results-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }\n@media (max-width:620px) { .ai-v2-panel-head,.ai-v2-outfit-head { flex-direction:column; } .ai-v2-results-grid { grid-template-columns:1fr; } }\n'''
              css.write_text(text)
          PY
          git rm -f .github/workflows/add-ai-v2-css.yml
          git add style.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Style AI discovery V2 interface"
          git push
