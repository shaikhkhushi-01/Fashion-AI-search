name: Fix AI V2 Payload

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix AI V2 Payload
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ai-experience.js')
          text = path.read_text()
          text = text.replace('const intent = data.intent || {};', 'const intent = data.intent || data.results?.[0]?.aiIntent || {};')
          text = text.replace('const outfit = data.outfitPlan;', 'const outfit = data.outfitPlan || data.results?.[0]?.outfitPlan;')
          text = text.replace('const style = data.stylePlan;', 'const style = data.stylePlan || data.results?.[0]?.stylePlan;')
          path.write_text(text)
          PY
          git rm -f .github/workflows/fix-ai-v2-payload.yml
          git add ai-experience.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Connect AI search reasoning payload"
          git push
