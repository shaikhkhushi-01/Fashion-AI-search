name: Fashion AI Research Quality

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  research-quality:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install dependencies
        run: npm install

      - name: Dataset quality check
        run: npm run dataset

      - name: Query understanding check
        run: npm run query-understanding

      - name: Semantic retrieval test
        run: python tests/semantic-search.py

      - name: Hybrid retrieval test
        run: npm run hybrid-test

      - name: Train learning-to-rank model
        run: npm run train-ranker

      - name: Ranker inference test
        run: npm run ranker-inference

      - name: Personalization test
        run: npm run personalization-test

      - name: Catalog discovery test
        run: npm run catalog-discovery-test

      - name: Discovery pagination test
        run: npm run discovery-pagination-test

      - name: AI Stylist test
        run: npm run stylist-test

      - name: Explainability test
        run: npm run explainability-test

      - name: Reproducibility check
        run: npm run reproducibility

      - name: Evaluation metrics test
        run: npm run evaluation-test

      - name: Evaluation benchmark
        run: npm run evaluate

      - name: Evaluation benchmark
        run: npm run evaluate

      - name: Robustness unit tests
        run: npm run robustness-test

      - name: Robustness benchmark
        run: npm run robustness

      - name: Ablation benchmark
        run: npm run ablation

      - name: Ablation unit tests
        run: npm run ablation-test

      - name: Ablation benchmark
        run: npm run ablation

      - name: Robustness benchmark
        run: npm run robustness

      - name: Reproducibility unit tests
        run: npm run reproducibility-test

      - name: Reproducibility check
        run: npm run reproducibility

      - name: Semantic client tests
        run: npm run semantic-client-test

      - name: Hybrid pipeline tests
        run: npm run hybrid-pipeline-test

      - name: Ranker pipeline tests
        run: npm run ranker-pipeline-test

      - name: Personalization V2 tests
        run: npm run personalization-v2-test

      - name: Image retrieval tests
        run: npm run image-retrieval-test

      - name: Visual client tests
        run: npm run visual-client-test

      - name: Multimodal fusion tests
        run: npm run multimodal-fusion-test

      - name: Explainability V2 tests
        run: npm run explainability-v2-test

      - name: Dataset split tests
        run: npm run dataset-split-test

      - name: Baseline tests
        run: npm run baseline-test

      - name: Error analysis tests
        run: npm run error-analysis-test

      - name: Statistics tests
        run: npm run statistics-test

      - name: Research report tests
        run: npm run research-report-test

      - name: Research quality summary
        run: |
          echo "======================================"
          echo " Fashion AI Research Quality Pipeline "
          echo "======================================"
          echo "Reproducibility: PASS"
          echo "Evaluation: PASS"
          echo "Ablation: PASS"
          echo "Robustness: PASS"
          echo "Dataset quality: PASS"
          echo "Query understanding: PASS"
          echo "Hybrid retrieval: PASS"
          echo "Learning-to-rank: PASS"
          echo "AI Stylist: PASS"
          echo "Explainability: PASS"
          echo "Personalization: PASS"
          echo "Catalog Discovery: PASS"
          echo "Discovery Pagination: PASS"
          echo "Evaluation metrics: PASS"
          echo "Evaluation benchmark: PASS"
          echo "Ablation study: PASS"
          echo "Robustness: PASS"
