name: Fashion AI Research Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  research-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install dependencies
        run: npm install

      - name: Run complete research test suite
        run: npm run all-tests

      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: fashion-ai-research-results
          path: |
            backend/evaluation-results/**
            backend/research-results/**
          if-no-files-found: ignore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install figure dependencies
        run: pip install matplotlib

      - name: Generate research figures
        working-directory: ..
        run: python research/generate_figures.py
