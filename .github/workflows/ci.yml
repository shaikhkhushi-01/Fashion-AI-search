name: Fashion AI Research Quality

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  research-quality:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Reproducibility check
        run: npm run reproducibility

      - name: Evaluation benchmark
        run: npm run evaluate

      - name: Ablation benchmark
        run: npm run ablation

      - name: Robustness benchmark
        run: npm run robustness
